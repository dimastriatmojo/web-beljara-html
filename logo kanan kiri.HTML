<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Logo di Sudut</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .logo-kiri {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .logo-kanan {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <img src="pemprov.jpg" alt="Logo Kiri" class="logo-kiri" width="100">
    <img src="tutwurihandayani.png" alt="Logo Kanan" class="logo-kanan" width="100">
</body>
</html>
